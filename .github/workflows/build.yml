name: deploy

on:
  push:
    branches:
      - feat-responsiveness

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci 

      - name: Build web-app
        env:
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY || vars.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID || vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID || vars.VITE_EMAILJS_TEMPLATE_ID }}
        run: |
          [ -n "$VITE_EMAILJS_PUBLIC_KEY" ] || (echo "Missing VITE_EMAILJS_PUBLIC_KEY" && exit 1)
          [ -n "$VITE_EMAILJS_SERVICE_ID" ] || (echo "Missing VITE_EMAILJS_SERVICE_ID" && exit 1)
          [ -n "$VITE_EMAILJS_TEMPLATE_ID" ] || (echo "Missing VITE_EMAILJS_TEMPLATE_ID" && exit 1)
          npm run build 

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4